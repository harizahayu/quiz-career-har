<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siapakah Kamu? - Mini Personality Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .quiz-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .quiz-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        .quiz-header h1::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border-radius: 2px;
        }
        
        .quiz-header p {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }
        
        .question {
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }
        
        .question-number {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .question-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .option:hover {
            border-color: #6a11cb;
            background-color: #f0f4ff;
            transform: translateY(-2px);
        }
        
        .option.selected {
            border-color: #6a11cb;
            background-color: #eef2ff;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.1);
        }
        
        .option-emoji {
            font-size: 22px;
            width: 30px;
        }
        
        .option-text {
            font-size: 16px;
            color: #333;
            flex-grow: 1;
        }
        
        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid #adb5bd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .option-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #6a11cb;
            border-radius: 50%;
            display: none;
        }
        
        .option.selected .option-radio {
            border-color: #6a11cb;
        }
        
        .option.selected .option-radio::after {
            display: block;
        }
        
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.3);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        
        .result-icon {
            font-size: 70px;
            margin-bottom: 20px;
            animation: bounce 1s ease;
        }
        
        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-description {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .restart-btn {
            background-color: #f8f9fa;
            color: #6a11cb;
            border: 2px solid #6a11cb;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        
        .restart-btn:hover {
            background-color: #6a11cb;
            color: white;
        }
        
        .progress-bar {
            height: 6px;
            background-color: #e9ecef;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            width: 33.33%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        .emoji {
            font-size: 22px;
            margin-right: 5px;
        }
        
        .quiz-footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>
        
        <div class="quiz-header">
            <h1>Siapakah Kamu? 🧐</h1>
            <p>Mini Personality Quiz - Temukan profesi IT yang cocok untukmu!</p>
        </div>
        
        <div id="quizContent">
            <!-- Pertanyaan akan dimuat di sini -->
        </div>
        
        <div class="result-container" id="resultContainer">
            <div class="result-icon" id="resultIcon">🎯</div>
            <h2 class="result-title" id="resultTitle"></h2>
            <p class="result-description" id="resultDescription"></p>
            <button class="restart-btn" id="restartBtn">🔄 Coba Lagi</button>
        </div>
        
        <div class="btn-container">
            <button class="btn" id="submitBtn">Lihat Hasil</button>
        </div>
        
        <div class="quiz-footer">
            <p>Mini Quiz - Temukan potensi karir IT-mu!</p>
        </div>
    </div>

    <script>
        // Data kuis
        const quizData = {
            questions: [
                {
                    id: 1,
                    text: "Kamu paling suka ngapain?",
                    options: [
                        { id: 'a', emoji: '💻', text: 'Ngoding sampai lupa waktu', value: 'developer' },
                        { id: 'b', emoji: '🎨', text: 'Bikin layout & warna yang estetik', value: 'designer' },
                        { id: 'c', emoji: '📊', text: 'Main data dan analisa tren', value: 'data' }
                    ]
                },
                {
                    id: 2,
                    text: "Kamu lebih suka alat yang mana?",
                    options: [
                        { id: 'a', emoji: '⚡', text: 'VS Code', value: 'developer' },
                        { id: 'b', emoji: '✨', text: 'Figma', value: 'designer' },
                        { id: 'c', emoji: '🔬', text: 'Google Colab', value: 'data' }
                    ]
                },
                {
                    id: 3,
                    text: "Motto kamu?",
                    options: [
                        { id: 'a', emoji: '🐛', text: 'Keep calm and debug the code', value: 'developer' },
                        { id: 'b', emoji: '👁️', text: 'Design is thinking made visual', value: 'designer' },
                        { id: 'c', emoji: '📈', text: 'In data we trust', value: 'data' }
                    ]
                }
            ],
            results: {
                developer: {
                    title: "Kamu cocok jadi SOFTWARE DEVELOPER! 💻",
                    icon: "👨‍💻",
                    description: "Kamu punya pola pikir logis, suka menyelesaikan masalah, dan tidak takut menghadapi bug! Dunia coding adalah rumahmu. Teruslah belajar framework baru dan bangun proyek-proyek keren!",
                    color: "#3498db"
                },
                designer: {
                    title: "Kamu cocok jadi UI/UX DESIGNER kreatif! 🎨",
                    icon: "👩‍🎨",
                    description: "Kamu memiliki mata untuk estetika dan pengalaman pengguna. Kombinasi antara kreativitas dan empati membuatmu cocok mendesain antarmuka yang indah dan fungsional!",
                    color: "#9b59b6"
                },
                data: {
                    title: "Kamu cocok jadi DATA SCIENTIST analitis! 📊",
                    icon: "👨‍🔬",
                    description: "Kamu senang menemukan pola dalam data dan membuat keputusan berdasarkan fakta. Dengan kemampuan analitismu, kamu bisa mengubah data menjadi insight yang berharga!",
                    color: "#2ecc71"
                }
            }
        };

        // State kuis
        let currentQuestion = 0;
        let answers = {};
        let quizCompleted = false;

        // Elemen DOM
        const quizContent = document.getElementById('quizContent');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultDescription = document.getElementById('resultDescription');
        const resultIcon = document.getElementById('resultIcon');
        const restartBtn = document.getElementById('restartBtn');
        const progressBar = document.getElementById('progressBar');

        // Inisialisasi kuis
        function initQuiz() {
            currentQuestion = 0;
            answers = {};
            quizCompleted = false;
            quizContent.style.display = 'block';
            resultContainer.style.display = 'none';
            submitBtn.textContent = 'Lihat Hasil';
            submitBtn.style.display = 'block';
            loadQuestion();
            updateProgressBar();
        }

        // Memuat pertanyaan
        function loadQuestion() {
            const question = quizData.questions[currentQuestion];
            
            let optionsHTML = '';
            question.options.forEach(option => {
                const isSelected = answers[currentQuestion] === option.id;
                optionsHTML += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-id="${option.id}">
                        <div class="option-emoji">${option.emoji}</div>
                        <div class="option-text">${option.text}</div>
                        <div class="option-radio"></div>
                    </div>
                `;
            });
            
            quizContent.innerHTML = `
                <div class="question">
                    <div class="question-number">${currentQuestion + 1}</div>
                    <h2 class="question-title">${question.text}</h2>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
            
            // Tambahkan event listener untuk pilihan
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', () => {
                    // Hapus seleksi dari semua pilihan di pertanyaan ini
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // Tambahkan seleksi ke pilihan yang diklik
                    option.classList.add('selected');
                    
                    // Simpan jawaban
                    answers[currentQuestion] = option.dataset.id;
                    
                    // Cek apakah semua pertanyaan sudah dijawab
                    checkAllQuestionsAnswered();
                });
            });
        }

        // Periksa apakah semua pertanyaan sudah dijawab
        function checkAllQuestionsAnswered() {
            const allAnswered = Object.keys(answers).length === quizData.questions.length;
            if (allAnswered) {
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            } else {
                submitBtn.style.opacity = '0.7';
                submitBtn.disabled = true;
            }
        }

        // Update progress bar
        function updateProgressBar() {
            const progressPercentage = ((currentQuestion + 1) / quizData.questions.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // Hitung hasil
        function calculateResult() {
            const scores = {
                developer: 0,
                designer: 0,
                data: 0
            };
            
            // Hitung skor berdasarkan jawaban
            quizData.questions.forEach((question, index) => {
                const answerId = answers[index];
                if (answerId) {
                    const selectedOption = question.options.find(opt => opt.id === answerId);
                    if (selectedOption) {
                        scores[selectedOption.value]++;
                    }
                }
            });
            
            // Tentukan hasil dengan skor tertinggi
            let maxScore = 0;
            let resultKey = 'developer';
            
            for (const [key, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    resultKey = key;
                }
            }
            
            return resultKey;
        }

        // Tampilkan hasil
        function showResult() {
            const resultKey = calculateResult();
            const result = quizData.results[resultKey];
            
            resultTitle.textContent = result.title;
            resultDescription.textContent = result.description;
            resultIcon.textContent = result.icon;
            
            // Animasi
            quizContent.style.display = 'none';
            resultContainer.style.display = 'block';
            submitBtn.style.display = 'none';
            progressBar.style.width = '100%';
            
            // Ubah warna container berdasarkan hasil
            document.querySelector('.quiz-container').style.borderTop = `5px solid ${result.color}`;
        }

        // Event listener untuk tombol submit
        submitBtn.addEventListener('click', () => {
            if (Object.keys(answers).length === quizData.questions.length) {
                showResult();
            } else {
                alert('Silakan jawab semua pertanyaan terlebih dahulu!');
            }
        });

        // Event listener untuk tombol restart
        restartBtn.addEventListener('click', initQuiz);

        // Inisialisasi kuis saat halaman dimuat
        document.addEventListener('DOMContentLoaded', initQuiz);
        
        // Tambahkan efek visual saat hover pada tombol
        submitBtn.addEventListener('mouseenter', () => {
            if (Object.keys(answers).length === quizData.questions.length) {
                submitBtn.style.transform = 'translateY(-3px)';
            }
        });
        
        submitBtn.addEventListener('mouseleave', () => {
            submitBtn.style.transform = 'translateY(0)';
        });
        
        // Tambahkan keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && Object.keys(answers).length === quizData.questions.length && !quizCompleted) {
                showResult();
            }
            
            if (e.key === '1' || e.key === '2' || e.key === '3') {
                const optionIndex = parseInt(e.key) - 1;
                const options = document.querySelectorAll('.option');
                if (optionIndex >= 0 && optionIndex < options.length) {
                    options[optionIndex].click();
                }
            }
        });
    </script>
</body>
</html>
