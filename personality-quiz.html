<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siapakah Kamu? - Mini Personality Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .question {
            margin-bottom: 30px;
            text-align: left;
        }
        
        .question h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }
        
        .question-number {
            background-color: #4a6ee0;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option:hover {
            border-color: #4a6ee0;
            background-color: #f8faff;
        }
        
        .option.selected {
            border-color: #4a6ee0;
            background-color: #eef2ff;
        }
        
        .option-emoji {
            font-size: 24px;
            margin-right: 15px;
            width: 40px;
        }
        
        .option-text {
            font-size: 16px;
            color: #333;
            flex-grow: 1;
            text-align: left;
        }
        
        .option-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .option-checkbox.selected::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #4a6ee0;
            border-radius: 50%;
        }
        
        .btn {
            background-color: #4a6ee0;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(74, 110, 224, 0.2);
        }
        
        .btn:hover {
            background-color: #3a5ed0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 110, 224, 0.3);
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background-color: #f8faff;
            border-radius: 15px;
            border-left: 5px solid #4a6ee0;
            text-align: left;
        }
        
        .result-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .result-title {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .result-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .restart-btn {
            background-color: white;
            color: #4a6ee0;
            border: 2px solid #4a6ee0;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .restart-btn:hover {
            background-color: #4a6ee0;
            color: white;
        }
        
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
        
        .progress-bar {
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #4a6ee0;
            width: 33%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Siapakah Kamu? 🧐</h1>
        <p class="subtitle">Mini Personality Quiz - Temukan profesi IT yang cocok untukmu!</p>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div id="quiz">
            <!-- Pertanyaan akan dimuat di sini oleh JavaScript -->
        </div>
        
        <button class="btn" id="submitBtn">Lihat Hasil</button>
        
        <div class="result" id="result">
            <div class="result-icon" id="resultIcon">🎯</div>
            <h2 class="result-title" id="resultTitle"></h2>
            <p class="result-description" id="resultDescription"></p>
            <button class="restart-btn" id="restartBtn">🔄 Coba Lagi</button>
        </div>
        
        <div class="footer">
            <p>Mini Quiz - Temukan potensi karir IT-mu!</p>
        </div>
    </div>

    <script>
        // Data kuis
        const quizData = [
            {
                question: "Kamu paling suka ngapain?",
                options: [
                    { text: "Ngoding sampai lupa waktu", emoji: "💻", type: "developer" },
                    { text: "Bikin layout & warna yang estetik", emoji: "🎨", type: "designer" },
                    { text: "Main data dan analisa tren", emoji: "📊", type: "data" }
                ]
            },
            {
                question: "Kamu lebih suka alat yang mana?",
                options: [
                    { text: "VS Code", emoji: "⚡", type: "developer" },
                    { text: "Figma", emoji: "✨", type: "designer" },
                    { text: "Google Colab", emoji: "🔬", type: "data" }
                ]
            },
            {
                question: "Motto kamu?",
                options: [
                    { text: "Keep calm and debug the code", emoji: "🐛", type: "developer" },
                    { text: "Design is thinking made visual", emoji: "👁️", type: "designer" },
                    { text: "In data we trust", emoji: "📈", type: "data" }
                ]
            }
        ];
        
        // Data hasil
        const results = {
            developer: {
                title: "Kamu cocok jadi SOFTWARE DEVELOPER! 💻",
                icon: "👨‍💻",
                description: "Kamu punya pola pikir logis, suka menyelesaikan masalah, dan tidak takut menghadapi bug! Dunia coding adalah rumahmu. Teruslah belajar framework baru dan bangun proyek-proyek keren!"
            },
            designer: {
                title: "Kamu cocok jadi UI/UX DESIGNER kreatif! 🎨",
                icon: "👩‍🎨",
                description: "Kamu memiliki mata untuk estetika dan pengalaman pengguna. Kombinasi antara kreativitas dan empati membuatmu cocok mendesain antarmuka yang indah dan fungsional!"
            },
            data: {
                title: "Kamu cocok jadi DATA SCIENTIST analitis! 📊",
                icon: "👨‍🔬",
                description: "Kamu senang menemukan pola dalam data dan membuat keputusan berdasarkan fakta. Dengan kemampuan analitismu, kamu bisa mengubah data menjadi insight yang berharga!"
            }
        };
        
        // State kuis
        let currentQuestion = 0;
        let userAnswers = [];
        const quizElement = document.getElementById('quiz');
        const submitBtn = document.getElementById('submitBtn');
        const resultElement = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultDescription = document.getElementById('resultDescription');
        const resultIcon = document.getElementById('resultIcon');
        const restartBtn = document.getElementById('restartBtn');
        const progressBar = document.getElementById('progress');
        
        // Fungsi untuk memuat pertanyaan
        function loadQuestion() {
            const questionData = quizData[currentQuestion];
            let optionsHTML = '';
            
            questionData.options.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                optionsHTML += `
                    <div class="option ${isSelected ? 'selected' : ''}" data-index="${index}">
                        <div class="option-emoji">${option.emoji}</div>
                        <div class="option-text">${option.text}</div>
                        <div class="option-checkbox ${isSelected ? 'selected' : ''}"></div>
                    </div>
                `;
            });
            
            quizElement.innerHTML = `
                <div class="question">
                    <h2><span class="question-number">${currentQuestion + 1}</span> ${questionData.question}</h2>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
            
            // Update progress bar
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
            
            // Tambahkan event listener untuk setiap opsi
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', () => {
                    // Hapus seleksi dari semua opsi di pertanyaan ini
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.classList.remove('selected');
                        opt.querySelector('.option-checkbox').classList.remove('selected');
                    });
                    
                    // Tambahkan seleksi ke opsi yang diklik
                    option.classList.add('selected');
                    option.querySelector('.option-checkbox').classList.add('selected');
                    
                    // Simpan jawaban pengguna
                    userAnswers[currentQuestion] = parseInt(option.dataset.index);
                });
            });
        }
        
        // Fungsi untuk menghitung hasil
        function calculateResult() {
            const typeCounts = { developer: 0, designer: 0, data: 0 };
            
            // Hitung setiap tipe berdasarkan jawaban
            userAnswers.forEach((answerIndex, questionIndex) => {
                if (answerIndex !== undefined) {
                    const type = quizData[questionIndex].options[answerIndex].type;
                    typeCounts[type]++;
                }
            });
            
            // Tentukan tipe dengan nilai tertinggi
            let maxCount = 0;
            let resultType = 'developer';
            
            for (const [type, count] of Object.entries(typeCounts)) {
                if (count > maxCount) {
                    maxCount = count;
                    resultType = type;
                }
            }
            
            return resultType;
        }
        
        // Fungsi untuk menampilkan hasil
        function showResult() {
            const resultType = calculateResult();
            const resultData = results[resultType];
            
            resultTitle.textContent = resultData.title;
            resultDescription.textContent = resultData.description;
            resultIcon.textContent = resultData.icon;
            
            // Sembunyikan kuis dan tampilkan hasil
            quizElement.style.display = 'none';
            submitBtn.style.display = 'none';
            resultElement.style.display = 'block';
        }
        
        // Fungsi untuk restart kuis
        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = [];
            quizElement.style.display = 'block';
            submitBtn.style.display = 'block';
            resultElement.style.display = 'none';
            loadQuestion();
        }
        
        // Event listener untuk tombol submit
        submitBtn.addEventListener('click', () => {
            // Periksa apakah semua pertanyaan telah dijawab
            if (userAnswers.length !== quizData.length || userAnswers.includes(undefined)) {
                alert('Silakan jawab semua pertanyaan terlebih dahulu!');
                return;
            }
            
            showResult();
        });
        
        // Event listener untuk tombol restart
        restartBtn.addEventListener('click', restartQuiz);
        
        // Inisialisasi kuis
        loadQuestion();
    </script>
</body>
</html>
